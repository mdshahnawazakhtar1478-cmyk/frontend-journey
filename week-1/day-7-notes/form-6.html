<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="form-6.css"/>
    <script src="form-6.js" defer></script>
</head>

<body>

    <form class="login-form">

        <section>

            <h2>Log In</h2>
            <p>Please continue to log in</p>   

        <div class="form-group">

            <label for="username">User Name or e-mail id:</label>
            <input type="text" placeholder="User Name or e-mail id" name="name" id="username"/>

        </div>

        <div class="form-group">

            <label for="password">Password:</label>
            <input type="password" placeholder="password" name="password" id="password"/>

        </div>

        <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember" id="remember"/>
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

        </div>

        <button type="submit" name="login">Login</button>

        </section>

    </form>
    
</body>

</html>
