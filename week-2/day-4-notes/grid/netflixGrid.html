<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="netflixGrid.css"/>
</head>

<body>

    <header>
        <section class="navbar">

            <div class="nav-left-container">
                <span class="logo">Netflix</span>

                <nav class="nav-left">
                    <a href="#">HOME</a>
                    <a href="#">TV Shows</a>
                    <a href="#">Movies</a>
                    <a href="#">New & Popular</a>
                    <a href="#">My List</a>
                </nav>

            </div>

            <div class="nav-right">
                <a href="#">🔍︎</a>
                <span class="kid">Kids</span>
                <a href="#">🕭</a>
                <a href="#" class="profile-icon">👤</a>

            </div>

        </section>
    </header>

    <main>
        <section class="hero">
            <img src="Netfilix.jpg" alt="movies banner"/>

            <span class="intro">
                Unlimited watching movies
            </span>

            <div class="hero-button">
                <button>Play</button>
                <button>Info</button>
            </div>

        </section>

        <section class="movies">

            <span class="popular">POPULAR</span>

            <section class="movie-box">

                <div class="movie-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2byOx9bJ0w1jzOHs7ii5EiyuE_CUXmjEmSWtwSl_tlg&s=10" alt="movie pic"/>
                </div>
                <div class="movie-card">Movie 2</div>
                <div class="movie-card">Movie 3</div>
                <div class="movie-card">Movie 4</div>
                <div class="movie-card">Movie 5</div>
                <div class="movie-card">Movie 6</div>
                <div class="movie-card">Movie 7</div>
                <div class="movie-card">Movie 8</div>
                <div class="movie-card">Movie 9</div>
                <div class="movie-card">Movie 10</div>

            </section>

            <span class="playing">Now Playing</span>

            <section class="movie-box-2">

                <div class="playing-card">Movie 1</div>
                <div class="playing-card">Movie 2</div>
                <div class="playing-card">Movie 3</div>
                <div class="playing-card">Movie 4</div>
                <div class="playing-card">Movie 5</div>
                <div class="playing-card">Movie 6</div>
                <div class="playing-card">Movie 7</div>
                <div class="playing-card">Movie 8</div>
                <div class="playing-card">Movie 9</div>
                <div class="playing-card">Movie 10</div>

            </section>

        </section>


    </main>
    
</body>
</html>
